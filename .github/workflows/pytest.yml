name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: pytest (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        env:
          # Stub secrets so tests that skip on missing env vars pass cleanly.
          OUTSCRAPER_API_KEY: test-key
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_METERED_PRICE_ID: price_test_placeholder
          MCP_SECRET: test-secret
          TEMPMAIL_RAPIDAPI_KEY: test-rapidapi-key
          TEMPMAIL_AUTH_TOKEN: test-auth-token
          GHL_CLIENT_ID: test-ghl-client-id
          GHL_CLIENT_SECRET: test-ghl-secret
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
        run: uv run pytest -q

      - name: Check tools.json is up to date
        run: uv run python scripts/generate_tools_manifest.py --check
